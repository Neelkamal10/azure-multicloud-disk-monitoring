---
- name: Validate the inventory record
  ansible.builtin.assert:
    that:
      - vm.id is match('^/subscriptions/[^/]+/resourceGroups/[^/]+/providers/Microsoft.Compute/virtualMachines/[^/]+$')
      - vm.osType | lower in ['windows', 'linux']
      - dcr_resource_id | length > 0
    fail_msg: "VM inventory is missing a supported OS or a valid resource/DCR ID."

- name: Check system-assigned managed identity
  ansible.builtin.command:
    argv:
      - az
      - vm
      - identity
      - show
      - --ids
      - "{{ vm.id }}"
      - --subscription
      - "{{ vm.subscriptionId }}"
      - --query
      - principalId
      - --output
      - tsv
  register: vm_identity
  changed_when: false

- name: Enable system-assigned managed identity for AMA
  ansible.builtin.command:
    argv:
      - az
      - vm
      - identity
      - assign
      - --ids
      - "{{ vm.id }}"
      - --subscription
      - "{{ vm.subscriptionId }}"
  when: vm_identity.stdout | trim | length == 0
  changed_when: true

- name: Check Azure Monitor Agent extension state
  ansible.builtin.command:
    argv:
      - az
      - vm
      - extension
      - list
      - --resource-group
      - "{{ vm.resourceGroup }}"
      - --vm-name
      - "{{ vm.name }}"
      - --subscription
      - "{{ vm.subscriptionId }}"
      - --query
      - "[?name=='{{ ama_extension_name }}'].provisioningState | [0]"
      - --output
      - tsv
  register: ama_state
  changed_when: false

- name: Install or repair Azure Monitor Agent
  ansible.builtin.command:
    argv:
      - az
      - vm
      - extension
      - set
      - --name
      - "{{ ama_extension_name }}"
      - --publisher
      - Microsoft.Azure.Monitor
      - --ids
      - "{{ vm.id }}"
      - --enable-auto-upgrade
      - 'true'
      - --subscription
      - "{{ vm.subscriptionId }}"
  when: ama_state.stdout | trim != 'Succeeded'
  changed_when: true

- name: Check the disk monitoring DCR association
  ansible.builtin.command:
    argv:
      - az
      - monitor
      - data-collection
      - rule
      - association
      - list
      - --resource
      - "{{ vm.id }}"
      - --subscription
      - "{{ vm.subscriptionId }}"
      - --query
      - "[?name=='disk-monitoring'].dataCollectionRuleId | [0]"
      - --output
      - tsv
  register: dcr_association
  changed_when: false

- name: Create or update the disk monitoring DCR association
  ansible.builtin.command:
    argv:
      - az
      - monitor
      - data-collection
      - rule
      - association
      - create
      - --name
      - disk-monitoring
      - --resource
      - "{{ vm.id }}"
      - --rule-id
      - "{{ dcr_resource_id }}"
      - --subscription
      - "{{ vm.subscriptionId }}"
  when: dcr_association.stdout | trim | lower != dcr_resource_id | lower
  changed_when: true
